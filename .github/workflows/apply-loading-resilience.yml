name: Apply loading resilience

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'trigger loading-resilience')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch loading resilience
        run: python .github/scripts/fix_loading_resilience.py
      - name: Syntax check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>', s)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/devhub.js').write_text(m.group(1))
          PY
          node --check /tmp/devhub.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git add index.html
          git commit -m "fix: make GitHub loading resilient"
          git push
