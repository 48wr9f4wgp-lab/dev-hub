name: Apply DEV HUB compact cards

on:
  push:
    paths:
      - '.github/workflows/apply-devhub-compact.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compact list cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''function cardHTML(r){const m=getMeta(r.name),sc=state.scans[r.name]||{tech:'unknown',kind:KIND_OVERRIDE[r.name]||'other',primary:[],autoDesc:r.description||''};const desc=displayDesc(r,sc);const visChip=r.private?'<span class="chip private">非公開</span>':'';const statusChip=m.status!=='not-started'?`<span class="chip ${chipClassStatus(m.status)}">${statusLabels[m.status]}</span>`:'';const k=kindLabels[sc.kind]||'その他',ts=techShort(sc.tech);const typeText=ts?`${k} · ${ts}`:k;return `<article class="card ${m.pinned?'pinned':''}" data-repo="${escapeHtml(r.name)}"><div class="cardtop"><div><div class="name">${escapeHtml(displayName(r.name))}</div><div class="repoid mono">${escapeHtml(r.name)}</div></div><div class="cardmeta"><span class="updated">${ago(r.pushed_at||r.updated_at)}</span><button class="pinbtn ${m.pinned?'on':''}" data-pin="${escapeHtml(r.name)}" aria-label="${m.pinned?'ピンを外す':'ピン留め'}">${m.pinned?'★':'☆'}</button></div></div><div class="desc ${desc?'':'missing'}">${escapeHtml(desc||'説明未設定 — タップして追加')}</div><div class="chips"><span class="chip ${sc.kind}">${escapeHtml(typeText)}</span>${visChip}${statusChip}</div><div class="structure"><span class="kicker">構成</span><span class="paths mono">${escapeHtml(compactPrimary(sc))}</span></div>${m.next?`<div class="nextline"><b>次：</b>${escapeHtml(m.next)}</div>`:''}</article>`}'''
          new='''function cardHTML(r){const m=getMeta(r.name),sc=state.scans[r.name]||{tech:'unknown',kind:KIND_OVERRIDE[r.name]||'other',primary:[],autoDesc:r.description||''};const desc=displayDesc(r,sc);const visChip=r.private?'<span class="chip private">非公開</span>':'';const statusChip=m.status!=='not-started'?`<span class="chip ${chipClassStatus(m.status)}">${statusLabels[m.status]}</span>`:'';const k=kindLabels[sc.kind]||'その他',ts=techShort(sc.tech);const typeText=ts?`${k} · ${ts}`:k;const structureHtml=sc.primary?.length?`<div class="structure"><span class="kicker">構成</span><span class="paths mono">${escapeHtml(compactPrimary(sc))}</span></div>`:'';return `<article class="card ${m.pinned?'pinned':''}" data-repo="${escapeHtml(r.name)}"><div class="cardtop"><div class="name">${escapeHtml(displayName(r.name))}</div><div class="cardmeta"><span class="updated">${ago(r.pushed_at||r.updated_at)}</span><button class="pinbtn ${m.pinned?'on':''}" data-pin="${escapeHtml(r.name)}" aria-label="${m.pinned?'ピンを外す':'ピン留め'}">${m.pinned?'★':'☆'}</button></div></div><div class="desc ${desc?'':'missing'}">${escapeHtml(desc||'説明未設定 — タップして追加')}</div><div class="chips"><span class="chip ${sc.kind}">${escapeHtml(typeText)}</span>${visChip}${statusChip}</div>${structureHtml}${m.next?`<div class="nextline"><b>次：</b>${escapeHtml(m.next)}</div>`:''}</article>`}'''
          if old not in s:
            raise SystemExit('target cardHTML not found')
          s=s.replace(old,new)
          s=s.replace("LS_CACHE='devhub.cache.v4'", "LS_CACHE='devhub.cache.v5'")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: hide repo IDs and pending structure in list"
          git push
