name: Apply typography normalization

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'trigger typography-normalization')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize typography
        run: python .github/scripts/normalize_typography.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git add index.html
          git commit -m "ui: normalize mobile typography"
          git push
