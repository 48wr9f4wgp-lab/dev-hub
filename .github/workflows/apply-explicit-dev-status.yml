name: Apply explicit DEV_STATUS

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'trigger explicit-dev-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch DEV HUB
        run: python .github/scripts/apply_explicit_dev_status.py
      - name: Verify JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>', s)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/devhub.js').write_text(m.group(1))
          PY
          node --check /tmp/devhub.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: use DEV_STATUS as canonical development state"
          git push
