name: Apply Japanese runtime fix

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'trigger japanese-runtime-fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime fix
        run: python .github/scripts/apply_japanese_phase_checks.py
      - name: Verify JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          if 'warn=False' in s:
              raise SystemExit('invalid False default remains')
          m=re.search(r'<script>([\s\S]*?)</script>', s)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/devhub.js').write_text(m.group(1))
          PY
          node --check /tmp/devhub.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: stabilize Japanese phase checks"
          git push
