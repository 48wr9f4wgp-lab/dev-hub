name: Apply auto maturity

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'trigger auto-maturity')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch DEV HUB maturity model
        run: python .github/scripts/apply_auto_maturity.py
      - name: Syntax check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>', s)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/devhub.js').write_text(m.group(1))
          if 'maturityFromPaths' not in m.group(1): raise SystemExit('maturity model missing')
          if 'maturityChipHTML' not in m.group(1): raise SystemExit('maturity chip missing')
          PY
          node --check /tmp/devhub.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add automatic development maturity" || exit 0
          git push
