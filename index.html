<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1117" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="GitHubの開発アプリを見渡す個人用の開発司令塔" />
  <title>開発司令塔 | DEV HUB</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    :root{--bg:#0b1117;--surface:#121a23;--surface2:#17212c;--border:#2a3948;--text:#f4f7fb;--muted:#9aa9b8;--cyan:#22d3ee;--green:#4ade80;--amber:#fbbf24;--red:#fb7185;--blue:#60a5fa;--radius:14px}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;line-height:1.45}button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
    .app{max-width:760px;margin:auto;padding:14px 14px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--cyan)}h1{font-size:22px;line-height:1.1;margin:3px 0 0}.sub{font-size:12px;color:var(--muted);margin:4px 0 0}.iconbtn{width:40px;height:40px;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);font-size:18px}
    .stats{display:flex;gap:7px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}.stats::-webkit-scrollbar{display:none}.stat{display:flex;align-items:center;gap:6px;flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 10px}.num{font-size:13px;font-weight:900}.label{font-size:11px;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.search{position:relative}.search input{width:100%;height:44px;padding:0 12px 0 39px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-size:15px;outline:none}.search:before{content:"⌕";position:absolute;left:13px;top:4px;font-size:25px;color:var(--muted)}.filter-toggle{height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-weight:800;padding:0 12px;white-space:nowrap}.filter-toggle.active{border-color:#155e75;background:#083344;color:#a5f3fc}.filter-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:5px;padding:0 5px;border-radius:999px;background:#155e75;color:#cffafe;font-size:10px}
    .filters{display:none;margin:9px 0 0;padding:12px;border:1px solid var(--border);border-radius:13px;background:var(--surface)}.filters.open{display:block}.filter-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:start;padding:5px 0}.filter-title{font-size:11px;font-weight:900;color:var(--muted);padding-top:7px}.choices{display:flex;flex-wrap:wrap;gap:6px}.choice{min-height:31px;border:1px solid var(--border);background:#0d151d;color:var(--muted);border-radius:999px;font-weight:800;font-size:11px;padding:4px 10px}.choice.active{border-color:#155e75;background:#083344;color:#a5f3fc}.filter-actions{display:flex;justify-content:flex-end;margin-top:7px}.reset{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;padding:7px}
    .sectionhead{display:flex;align-items:end;justify-content:space-between;margin:16px 0 8px}.sectionhead h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted)}
    .cards{display:grid;gap:9px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px;cursor:pointer}.card:active{transform:scale(.995)}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:17px;font-weight:850;overflow-wrap:anywhere}.updated{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:2px}.desc{font-size:13px;line-height:1.5;margin:7px 0 8px;color:#d9e2ec;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.desc.missing{color:var(--muted)}
    .chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:800;color:var(--muted)}.chip.godot{border-color:#0e7490;color:#67e8f9;background:#083344}.chip.web{border-color:#15803d;color:#86efac;background:#052e16}.chip.private{border-color:#92400e;color:#fcd34d;background:#451a03}.chip.dev{border-color:#1d4ed8;color:#93c5fd;background:#172554}.chip.done{border-color:#15803d;color:#86efac;background:#052e16}
    .structure{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);min-width:0}.kicker{font-size:10px;font-weight:900;color:var(--muted);white-space:nowrap}.paths{font-size:11px;color:#c5d1dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.nextline{margin-top:7px;font-size:11px;color:#d8e4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nextline b{color:var(--green)}
    .empty,.loading,.error{padding:28px 12px;text-align:center;color:var(--muted)}.error{color:#fecdd3}.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .drawer{position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateX(100%);transition:.22s ease;overflow:auto}.drawer.open{transform:none}.drawer-inner{max-width:760px;margin:auto;padding:12px 14px calc(90px + env(safe-area-inset-bottom))}.drawerbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:rgba(11,17,23,.95);backdrop-filter:blur(14px);padding:7px 0 10px;z-index:2}.back{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;height:40px;padding:0 12px;font-weight:800}.drawer-title{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:10px 0}.panel h3{font-size:14px;margin:0 0 10px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:10px;background:#0d151d;color:var(--text);padding:10px 11px;outline:none}.field textarea{min-height:72px;resize:vertical}.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.statusbtn{border:1px solid var(--border);border-radius:9px;background:#0d151d;color:var(--muted);padding:9px;font-weight:800}.statusbtn.active{border-color:#0e7490;background:#083344;color:#a5f3fc}.range{width:100%;accent-color:#22d3ee}.savehint{font-size:11px;color:var(--muted)}
    .summarygrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mini{background:#0d151d;border:1px solid var(--border);border-radius:10px;padding:10px}.mini b{display:block;font-size:18px}.mini span{font-size:11px;color:var(--muted)}.filelist{display:grid;gap:5px;max-height:360px;overflow:auto}.file{font-size:11px;padding:7px 9px;background:#0d151d;border-radius:7px;color:#cbd5e1;overflow-wrap:anywhere}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:11px;font-weight:800;font-size:13px}.action.primary{background:#083344;color:#a5f3fc;border-color:#155e75}
    dialog{width:min(92vw,560px);border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);padding:0}dialog::backdrop{background:rgba(0,0,0,.72)}.modal{padding:16px}.modal h2{font-size:18px;margin:0 0 8px}.modal p{font-size:12px;color:var(--muted)}.closemodal{float:right;border:0;background:transparent;color:var(--muted);font-size:24px}.danger{color:#fecdd3}.small{font-size:11px;color:var(--muted)}
    @media(min-width:640px){.app{padding-top:20px}.top h1{font-size:25px}.stats{padding:16px 0 12px}.cards{grid-template-columns:1fr 1fr}.filters{display:block}.filter-toggle{display:none}.filter-row{grid-template-columns:78px 1fr}.card{padding:15px}.desc{font-size:13.5px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><div class="eyebrow">DEV HUB</div><h1>開発司令塔</h1><p class="sub">アプリ一覧・構成確認</p></div>
    <button class="iconbtn" id="settingsBtn" aria-label="設定">⚙︎</button>
  </header>
  <section class="stats" id="stats"></section>
  <div class="toolbar">
    <div class="search"><input id="search" placeholder="アプリ名・説明で検索" /></div>
    <button class="filter-toggle" id="filterToggle">絞り込み<span class="filter-badge" id="filterBadge" hidden>0</span></button>
  </div>
  <section class="filters" id="filtersPanel">
    <div class="filter-row"><div class="filter-title">技術</div><div class="choices" id="techChoices"></div></div>
    <div class="filter-row"><div class="filter-title">進捗</div><div class="choices" id="statusChoices"></div></div>
    <div class="filter-row"><div class="filter-title">公開</div><div class="choices" id="visChoices"></div></div>
    <div class="filter-actions"><button class="reset" id="resetFilters">絞り込みを解除</button></div>
  </section>
  <div class="sectionhead"><h2>アプリ一覧</h2><span class="count" id="resultCount"></span></div>
  <div id="message" class="loading"><span class="spinner"></span><br>GitHubから読み込み中…</div>
  <section class="cards" id="cards"></section>
</div>

<section class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-inner">
    <div class="drawerbar"><button class="back" id="backBtn">← 戻る</button><div class="drawer-title mono" id="drawerTitle"></div></div>
    <div id="detail"></div>
  </div>
</section>

<dialog id="settingsDialog"><div class="modal">
  <button class="closemodal" id="closeSettings">×</button>
  <h2>設定</h2>
  <p>公開リポジトリは設定不要。非公開リポジトリも表示したい場合だけ、GitHubのFine-grained personal access tokenをこの端末に保存できます。</p>
  <div class="field"><label>GitHubトークン（任意）</label><input id="tokenInput" type="password" autocomplete="off" placeholder="github_pat_..." /></div>
  <p class="small">トークンはこのブラウザのlocalStorageだけに保存し、DEV HUBのサーバーには送信しません。ただし端末を他人と共有する場合は保存しないでください。</p>
  <div class="buttons"><button class="action primary" id="saveToken">保存して再読み込み</button><button class="action" id="clearToken">削除</button></div>
  <hr style="border:0;border-top:1px solid var(--border);margin:16px 0">
  <button class="action danger" id="clearMeta" style="width:100%">進捗・メモをすべて初期化</button>
</div></dialog>

<script>
const OWNER='48wr9f4wgp-lab';
const LS_META='devhub.meta.v2', LS_TOKEN='devhub.token.v1', LS_CACHE='devhub.cache.v1';
const state={repos:[],scans:{},tech:'all',status:'all',vis:'all',q:'',active:null};
const $=s=>document.querySelector(s);const cards=$('#cards'),msg=$('#message');
const statusLabels={'not-started':'未着手','development':'開発中','hold':'保留','complete':'完了'};
const techLabels={godot:'Godot',web:'Web / PWA',other:'その他',unknown:'確認中'};
const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const loadJSON=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}};
const saveJSON=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let meta=loadJSON(LS_META,{}),cache=loadJSON(LS_CACHE,{});
const getMeta=name=>Object.assign({description:'',status:'not-started',progress:0,objective:'',next:'',memo:''},meta[name]||{});
function setMeta(name,patch){meta[name]=Object.assign(getMeta(name),patch);saveJSON(LS_META,meta);render();if(state.active===name)renderDetail(name,false)}
function headers(){const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};const t=localStorage.getItem(LS_TOKEN);if(t)h.Authorization=`Bearer ${t}`;return h}
async function api(url){const r=await fetch(url,{headers:headers()});if(!r.ok){let m=`GitHub API ${r.status}`;try{const j=await r.json();m=j.message||m}catch{}throw new Error(m)}return r.json()}
function ago(iso){if(!iso)return'更新日不明';const d=Math.floor((Date.now()-new Date(iso))/86400000);if(d<1)return'今日更新';if(d<30)return`${d}日前`;if(d<365)return`${Math.floor(d/30)}か月前`;return`${Math.floor(d/365)}年前`}
function decode64(s){try{return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}catch{return''}}
function readmeSummary(md){if(!md)return'';const lines=md.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(const line of lines){if(/^#|^!\[|^\[!\[|^<|^---|^```/.test(line))continue;const clean=line.replace(/\[([^\]]+)\]\([^\)]+\)/g,'$1').replace(/[*_`>#]/g,'').trim();if(clean.length>=18)return clean.slice(0,140)}return''}
async function loadRepos(){msg.className='loading';msg.innerHTML='<span class="spinner"></span><br>GitHubから読み込み中…';cards.innerHTML='';try{const token=localStorage.getItem(LS_TOKEN);let repos;if(token){const all=await api('https://api.github.com/user/repos?per_page=100&sort=pushed&affiliation=owner');repos=all.filter(r=>r.owner?.login===OWNER)}else{repos=await api(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=pushed&type=owner`)}state.repos=repos.filter(r=>!r.archived);msg.style.display='none';render();queueScans()}catch(e){msg.style.display='block';msg.className='error';msg.textContent='読み込み失敗: '+e.message}}
function rootKey(repo){return `${repo.name}|${repo.pushed_at||repo.updated_at}`}
async function scanRepo(repo){const k=rootKey(repo);if(cache[k]&&Date.now()-cache[k].at<12*3600*1000){state.scans[repo.name]=cache[k].data;render();return}try{const root=await api(`https://api.github.com/repos/${OWNER}/${encodeURIComponent(repo.name)}/contents/?ref=${encodeURIComponent(repo.default_branch)}`);const names=Array.isArray(root)?root.map(x=>x.name):[];const dirs=Array.isArray(root)?root.filter(x=>x.type==='dir').map(x=>x.name+'/'):[];const lower=names.map(x=>x.toLowerCase());let tech='other';if(lower.includes('project.godot'))tech='godot';else if(lower.includes('package.json')||lower.includes('index.html')||lower.some(x=>x.includes('manifest'))||lower.some(x=>x.includes('service-worker')))tech='web';let primary=[];if(tech==='godot'){for(const x of ['main.tscn','project.godot','scripts/','scenes/','assets/','docs/','tests/','addons/','web/'])if(names.includes(x.replace('/',''))||dirs.includes(x))primary.push(x)}else if(tech==='web'){for(const x of ['index.html','src/','app/','public/','components/','styles/','manifest.webmanifest','manifest.json','package.json','.github/'])if(names.includes(x.replace('/',''))||dirs.includes(x))primary.push(x)}else primary=[...dirs.slice(0,4),...names.filter(x=>/^readme|package\.json/i.test(x)).slice(0,1)];let autoDesc=repo.description||'';if(!autoDesc&&names.some(n=>/^readme/i.test(n))){try{const rd=await api(`https://api.github.com/repos/${OWNER}/${encodeURIComponent(repo.name)}/readme?ref=${encodeURIComponent(repo.default_branch)}`);autoDesc=readmeSummary(decode64(rd.content||''))}catch{}}const data={tech,primary:primary.slice(0,5),autoDesc};state.scans[repo.name]=data;cache[k]={at:Date.now(),data};saveJSON(LS_CACHE,cache);render()}catch(e){state.scans[repo.name]={tech:'unknown',primary:[],autoDesc:repo.description||'',error:e.message};render()}}
async function queueScans(){const arr=[...state.repos];const workers=Array.from({length:3},async()=>{while(arr.length){const r=arr.shift();await scanRepo(r)}});await Promise.all(workers)}
function stats(){const rs=state.repos;const vals=[['アプリ',rs.length],['公開',rs.filter(r=>!r.private).length],['開発中',rs.filter(r=>getMeta(r.name).status==='development').length],['完了',rs.filter(r=>getMeta(r.name).status==='complete').length]];if(rs.some(r=>r.private))vals.splice(2,0,['非公開',rs.filter(r=>r.private).length]);$('#stats').innerHTML=vals.map(([l,n])=>`<div class="stat"><span class="num">${n}</span><span class="label">${l}</span></div>`).join('')}
function chipClassStatus(s){return s==='development'?'dev':s==='complete'?'done':''}
function statusRank(s){return s==='development'?0:s==='not-started'?1:s==='hold'?2:3}
function filtered(){return state.repos.filter(r=>{const m=getMeta(r.name),sc=state.scans[r.name]||{tech:'unknown',autoDesc:r.description||''};const desc=m.description||sc.autoDesc||'';return(!state.q||`${r.name} ${desc}`.toLowerCase().includes(state.q.toLowerCase()))&&(state.tech==='all'||sc.tech===state.tech)&&(state.status==='all'||m.status===state.status)&&(state.vis==='all'||(state.vis==='private')===!!r.private)}).sort((a,b)=>{const sr=statusRank(getMeta(a.name).status)-statusRank(getMeta(b.name).status);if(sr)return sr;return new Date(b.pushed_at||b.updated_at)-new Date(a.pushed_at||a.updated_at)})}
function compactPrimary(sc){if(!sc.primary?.length)return'構成を確認中…';const shown=sc.primary.slice(0,3);return shown.join(' / ')+(sc.primary.length>3?` +${sc.primary.length-3}`:'')}
function cardHTML(r){const m=getMeta(r.name),sc=state.scans[r.name]||{tech:'unknown',primary:[],autoDesc:r.description||''};const desc=m.description||sc.autoDesc||'';return `<article class="card" data-repo="${escapeHtml(r.name)}"><div class="cardtop"><div class="name mono">${escapeHtml(r.name)}</div><div class="updated">${ago(r.pushed_at||r.updated_at)}</div></div><div class="desc ${desc?'':'missing'}">${escapeHtml(desc||'説明未設定 — タップして追加')}</div><div class="chips"><span class="chip ${sc.tech==='godot'?'godot':sc.tech==='web'?'web':''}">${escapeHtml(techLabels[sc.tech]||'確認中')}</span><span class="chip ${r.private?'private':''}">${r.private?'非公開':'公開'}</span><span class="chip ${chipClassStatus(m.status)}">${statusLabels[m.status]}</span></div><div class="structure"><span class="kicker">構成</span><span class="paths mono">${escapeHtml(compactPrimary(sc))}</span></div>${m.next?`<div class="nextline"><b>次：</b>${escapeHtml(m.next)}</div>`:''}</article>`}
function activeFilterCount(){return Number(state.tech!=='all')+Number(state.status!=='all')+Number(state.vis!=='all')}
function updateFilterUI(){const n=activeFilterCount(),badge=$('#filterBadge'),btn=$('#filterToggle');badge.hidden=!n;badge.textContent=n;btn.classList.toggle('active',n>0||$('#filtersPanel').classList.contains('open'))}
function render(){stats();const rs=filtered();$('#resultCount').textContent=`${rs.length}件`;cards.innerHTML=rs.map(cardHTML).join('');if(!rs.length&&state.repos.length)cards.innerHTML='<div class="empty">条件に合うアプリはありません。</div>';cards.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openRepo(el.dataset.repo)));updateFilterUI()}
function choiceGroup(el,items,key){el.innerHTML=items.map(([v,l])=>`<button class="choice ${state[key]===v?'active':''}" data-v="${v}">${l}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{state[key]=b.dataset.v;choiceGroup(el,items,key);render()})}
const TECH_ITEMS=[['all','すべて'],['godot','Godot'],['web','Web/PWA'],['other','その他']],STATUS_ITEMS=[['all','すべて'],['not-started','未着手'],['development','開発中'],['hold','保留'],['complete','完了']],VIS_ITEMS=[['all','すべて'],['public','公開'],['private','非公開']];
choiceGroup($('#techChoices'),TECH_ITEMS,'tech');choiceGroup($('#statusChoices'),STATUS_ITEMS,'status');choiceGroup($('#visChoices'),VIS_ITEMS,'vis');
$('#search').addEventListener('input',e=>{state.q=e.target.value;render()});
$('#filterToggle').onclick=()=>{$('#filtersPanel').classList.toggle('open');updateFilterUI()};
$('#resetFilters').onclick=()=>{state.tech=state.status=state.vis='all';choiceGroup($('#techChoices'),TECH_ITEMS,'tech');choiceGroup($('#statusChoices'),STATUS_ITEMS,'status');choiceGroup($('#visChoices'),VIS_ITEMS,'vis');render()};
async function openRepo(name){state.active=name;history.replaceState(null,'','#repo='+encodeURIComponent(name));$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';renderDetail(name,true)}
function closeRepo(){state.active=null;history.replaceState(null,'',location.pathname+location.search);$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');document.body.style.overflow=''}
$('#backBtn').onclick=closeRepo;
async function detailScan(repo){const k='tree|'+rootKey(repo);if(cache[k]&&Date.now()-cache[k].at<12*3600*1000)return cache[k].data;const tree=await api(`https://api.github.com/repos/${OWNER}/${encodeURIComponent(repo.name)}/git/trees/${encodeURIComponent(repo.default_branch)}?recursive=1`);const paths=(tree.tree||[]).filter(x=>x.type==='blob').map(x=>x.path);const data={paths};cache[k]={at:Date.now(),data};saveJSON(LS_CACHE,cache);return data}
function summaryFor(paths,tech){const countExt=ext=>paths.filter(p=>p.toLowerCase().endsWith(ext)).length;const folders=new Set(paths.filter(p=>p.includes('/')).map(p=>p.split('/')[0]));if(tech==='godot')return[['シーン',countExt('.tscn')],['スクリプト',countExt('.gd')],['素材',paths.filter(p=>/^(assets|art)\//i.test(p)).length],['フォルダ',folders.size]];if(tech==='web')return[['HTML',countExt('.html')],['JS/TS',countExt('.js')+countExt('.ts')+countExt('.tsx')],['CSS',countExt('.css')],['フォルダ',folders.size]];return[['ファイル',paths.length],['フォルダ',folders.size],['文書',countExt('.md')],['テスト',paths.filter(p=>/test/i.test(p)).length]]}
async function renderDetail(name,fetchTree=true){const repo=state.repos.find(r=>r.name===name);if(!repo)return;const m=getMeta(name),sc=state.scans[name]||{tech:'unknown',autoDesc:repo.description||'',primary:[]};$('#drawerTitle').textContent=name;const detail=$('#detail');detail.innerHTML=`<div class="panel"><div class="eyebrow">${escapeHtml(techLabels[sc.tech]||'確認中')}</div><h2 class="mono" style="margin:5px 0 8px;font-size:22px">${escapeHtml(name)}</h2><div class="chips"><span class="chip ${repo.private?'private':''}">${repo.private?'非公開':'公開'}</span><span class="chip ${chipClassStatus(m.status)}">${statusLabels[m.status]}</span></div></div>${editorHTML(name,m,sc.autoDesc||repo.description||'')}<div class="panel" id="structurePanel"><h3>主要構成</h3><div class="paths mono" style="white-space:normal">${sc.primary.length?escapeHtml(sc.primary.join(' / ')):'構成を確認中…'}</div><div id="deepStructure" class="loading" style="display:${fetchTree?'block':'none'}">詳細構成を読み込み中…</div></div><div class="panel"><h3>リンク</h3><div class="buttons"><a class="action primary" target="_blank" rel="noopener" href="${repo.html_url}">GitHubを開く</a>${repo.homepage?`<a class="action" target="_blank" rel="noopener" href="${escapeHtml(repo.homepage)}">公開版を開く</a>`:''}</div></div>`;bindEditor(name);if(fetchTree){try{const d=await detailScan(repo);if(state.active!==name)return;const sums=summaryFor(d.paths,sc.tech);const relevant=d.paths.filter(p=>sc.tech==='godot'?/\.tscn$|\.gd$|^assets\/|^docs\/|^tests\/|project\.godot|export_presets/i.test(p):sc.tech==='web'?/\.html$|\.(js|ts|tsx|css)$|manifest|service.worker|package\.json|^src\/|^public\//i.test(p):true).slice(0,70);$('#deepStructure').className='';$('#deepStructure').innerHTML=`<div class="summarygrid" style="margin-top:12px">${sums.map(([l,n])=>`<div class="mini"><b>${n}</b><span>${l}</span></div>`).join('')}</div><h3 style="margin-top:16px">主要ファイル</h3><div class="filelist">${relevant.map(p=>`<div class="file mono">${escapeHtml(p)}</div>`).join('')||'<div class="small">表示対象のファイルがありません。</div>'}</div>`}catch(e){if($('#deepStructure')){$('#deepStructure').className='error';$('#deepStructure').textContent='詳細構成を取得できません: '+e.message}}}}
function editorHTML(name,m,autoDesc){return `<div class="panel"><h3>説明・進捗</h3><div class="field"><label>ひとこと説明</label><textarea id="fDesc" placeholder="このアプリは何をするもの？">${escapeHtml(m.description||autoDesc||'')}</textarea></div><div class="field"><label>進捗状態</label><div class="statusgrid" id="statusGrid">${Object.entries(statusLabels).map(([v,l])=>`<button class="statusbtn ${m.status===v?'active':''}" data-s="${v}">${l}</button>`).join('')}</div></div><div class="field"><label>進捗 <span id="progressVal">${m.progress}%</span></label><input class="range" id="fProgress" type="range" min="0" max="100" step="5" value="${m.progress}"></div><div class="field"><label>現在の目的</label><input id="fObjective" value="${escapeHtml(m.objective)}" placeholder="今どこを作っている？"></div><div class="field"><label>次にやること</label><input id="fNext" value="${escapeHtml(m.next)}" placeholder="次の一手を1つだけ"></div><div class="field"><label>メモ</label><textarea id="fMemo" placeholder="覚えておきたいこと">${escapeHtml(m.memo)}</textarea></div><div class="savehint">入力内容はこの端末に自動保存されます。</div></div>`}
function bindEditor(name){const save=()=>setMeta(name,{description:$('#fDesc').value,progress:Number($('#fProgress').value),objective:$('#fObjective').value,next:$('#fNext').value,memo:$('#fMemo').value});['fDesc','fObjective','fNext','fMemo'].forEach(id=>$('#'+id).addEventListener('change',save));$('#fProgress').oninput=e=>{$('#progressVal').textContent=e.target.value+'%'};$('#fProgress').onchange=save;$('#statusGrid').querySelectorAll('button').forEach(b=>b.onclick=()=>setMeta(name,{status:b.dataset.s}))}
const dlg=$('#settingsDialog');$('#settingsBtn').onclick=()=>{dlg.showModal();$('#tokenInput').value=localStorage.getItem(LS_TOKEN)||''};$('#closeSettings').onclick=()=>dlg.close();$('#saveToken').onclick=()=>{const t=$('#tokenInput').value.trim();if(t)localStorage.setItem(LS_TOKEN,t);else localStorage.removeItem(LS_TOKEN);cache={};saveJSON(LS_CACHE,cache);dlg.close();loadRepos()};$('#clearToken').onclick=()=>{localStorage.removeItem(LS_TOKEN);$('#tokenInput').value='';cache={};saveJSON(LS_CACHE,cache);dlg.close();loadRepos()};$('#clearMeta').onclick=()=>{if(confirm('進捗・説明・メモをすべて初期化しますか？')){meta={};saveJSON(LS_META,meta);dlg.close();render()}};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
loadRepos().then(()=>{const m=location.hash.match(/^#repo=(.+)$/);if(m)openRepo(decodeURIComponent(m[1]))});
</script>
</body>
</html>
